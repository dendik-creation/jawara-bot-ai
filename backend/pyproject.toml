[project]
name = "backend"
version = "0.1.0"
description = "JAWARA FastAPI gateway: WhatsApp webhook intake, detection pipeline, Control Panel read API"
readme = "README.md"
authors = [
    { name = "dendik-creation", email = "setiawandendik0205@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "celery==5.3.6",
    "email-validator==2.3.0",
    "fastapi==0.110.0",
    "httpx==0.27.0",
    "pydantic-settings==2.2.1",
    "qdrant-client==1.8.2",
    "redis==5.0.1",
    "uvicorn[standard]==0.27.1",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
]

[tool.uv]
# The gateway is an application, not a distributable library: `app/` is imported
# from the working directory, never installed. Without this, `uv sync` would try
# to build and install the project itself on every dependency change.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs live Postgres/Qdrant/Redis (skipped when unreachable)",
]
