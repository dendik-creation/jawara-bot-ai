[project]
name = "ml-service"
version = "0.1.0"
description = "JAWARA inference service: embeddings, RAG retrieval, reply generation"
readme = "README.md"
authors = [
    { name = "dendik-creation", email = "setiawandendik0205@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.110.0",
    "httpx==0.27.0",
    "joblib==1.5.3",
    # Image decode/validate/preprocess for OCR (app/models/ocr.py).
    "pillow==12.3.0",
    "pydantic-settings==2.2.1",
    # Required by FastAPI to parse the multipart/form-data body /v1/ocr uses
    # instead of the JSON envelope every other endpoint takes.
    "python-multipart==0.0.20",
    # Thin wrapper around the `tesseract` binary installed in the Docker
    # image (see Dockerfile) — not a bundled OCR engine of its own.
    "pytesseract==0.3.13",
    "qdrant-client==1.8.2",
    "scikit-learn==1.9.0",
    "uvicorn[standard]==0.27.1",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
]

[tool.uv]
# Application, not a library — see backend/pyproject.toml for the same note.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs a live Qdrant (skipped when unreachable)",
]
