name: "jawara-bot-ai"
services:
  waha:
    image: devlikeapro/waha:latest
    container_name: jawara-waha
    restart: always
    ports:
      # 127.0.0.1, not 0.0.0.0: the dashboard (for QR-login setup) is a human
      # admin tool, not a public endpoint — reach it over SSH port-forwarding,
      # not the open internet. The webhook itself never needs a published
      # port; api-gateway reaches WAHA over jawara-net.
      - "127.0.0.1:${WAHA_PORT}:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_HOOK_URL=http://api-gateway:8000/api/v1/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_HOOK_CUSTOM_HEADERS=X-Api-Key:${WAHA_API_KEY}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - jawara-net
    healthcheck:
      # /ping is the only unauthenticated route; / and /health return 401 once
      # WAHA_DASHBOARD_* credentials are set.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build: ./backend
    container_name: jawara-gateway
    restart: always
    ports:
      # 127.0.0.1: public traffic comes in through `reverse-proxy` on the
      # jawara-net Docker network, not this published port — that one stays
      # for host-side debugging (curl from the VPS itself) only.
      - "127.0.0.1:${API_GATEWAY_PORT}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS}
      - USER_HASH_SALT=${USER_HASH_SALT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - ML_SERVICE_URL=http://ml-service:9000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - AUTH_SESSION_TTL_MINUTES=${AUTH_SESSION_TTL_MINUTES}
      - AUTH_BCRYPT_ROUNDS=${AUTH_BCRYPT_ROUNDS}
      - AUTH_LOGIN_MAX_ATTEMPTS=${AUTH_LOGIN_MAX_ATTEMPTS}
      - AUTH_LOGIN_WINDOW_SECONDS=${AUTH_LOGIN_WINDOW_SECONDS}
      # Read by `app.scripts.create_operator` when run via `docker exec` during
      # setup — not consumed by the API process itself.
      - OPERATOR_EMAIL=${OPERATOR_EMAIL}
      - OPERATOR_NAME=${OPERATOR_NAME}
      - OPERATOR_PASSWORD=${OPERATOR_PASSWORD}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
      - LOG_MESSAGE_CONTENT=${LOG_MESSAGE_CONTENT}
      - LOG_LEVEL=${LOG_LEVEL}
      # Read by app.scripts.import_hoax_corpus / split_hoax_corpus — the
      # ./datasets bind mount below, not something baked into the image.
      - HOAX_CORPUS_DIR=/app/datasets/indonesia_hoax_news
    volumes:
      # Raw training-data corpus. Read-only, host-provided — never baked into
      # the image (backend/ is the build context, datasets/ is its sibling).
      - ./datasets:/app/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery-worker:
    build: ./backend
    container_name: jawara-worker
    restart: always
    # -Q jawara.messages,jawara.training,jawara.evaluation,jawara.ingestion: one
    # worker consumes all four queues — Training Jobs (05_Training_Jobs §6),
    # Model Evaluation (06_Model_Evaluation.md) and fact-check ingestion
    # (03_Knowledge_Base.md) each get their own logical queue so a
    # long-running job of one kind doesn't park message-pipeline jobs (or
    # each other) behind it, without standing up separate worker processes yet.
    command: celery -A app.worker worker --loglevel=info -Q jawara.messages,jawara.training,jawara.evaluation,jawara.ingestion
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - USER_HASH_SALT=${USER_HASH_SALT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - ML_SERVICE_URL=http://ml-service:9000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - RAG_CLAIM_EXTRACTION_ENABLED=${RAG_CLAIM_EXTRACTION_ENABLED:-true}
      - GROUP_REPLY_REQUIRES_TRIGGER=${GROUP_REPLY_REQUIRES_TRIGGER}
      - BOT_WHATSAPP_IDS=${BOT_WHATSAPP_IDS}
      # `:-` defaults throughout: these arrived after the first deployments, and
      # an .env written before them would otherwise inject empty strings, which
      # fail settings validation and crash-loop the worker.
      - FACT_INGESTION_ENABLED=${FACT_INGESTION_ENABLED:-true}
      - FACT_INGESTION_SOURCES=${FACT_INGESTION_SOURCES:-turnbackhoax}
      - FACT_INGESTION_INTERVAL_MINUTES=${FACT_INGESTION_INTERVAL_MINUTES:-60}
      - FACT_INGESTION_MAX_ITEMS=${FACT_INGESTION_MAX_ITEMS:-25}
      - FACT_INGESTION_REQUEST_DELAY_SECONDS=${FACT_INGESTION_REQUEST_DELAY_SECONDS:-1.5}
      - FACT_INGESTION_REFRESH_AFTER_HOURS=${FACT_INGESTION_REFRESH_AFTER_HOURS:-24}
      - FACT_INGESTION_REFRESH_WINDOW_DAYS=${FACT_INGESTION_REFRESH_WINDOW_DAYS:-7}
      - FACT_INGESTION_AUTO_SYNC=${FACT_INGESTION_AUTO_SYNC:-true}
      # Blank is tolerated (settings fall back to the built-in identifier) —
      # the User-Agent contains spaces and parentheses, so a Compose-side
      # default here would be more fragile than the Python one.
      - FACT_INGESTION_USER_AGENT=${FACT_INGESTION_USER_AGENT:-}
      - TURNBACKHOAX_FEED_URL=${TURNBACKHOAX_FEED_URL:-https://turnbackhoax.id/feed}
      - LOG_MESSAGE_CONTENT=${LOG_MESSAGE_CONTENT}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      # CMD-SHELL, not CMD: exec form runs no shell, so $HOSTNAME would stay a
      # literal string and the ping would never match the node name.
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  celery-beat:
    build: ./backend
    container_name: jawara-beat
    restart: always
    # Scheduler only — it enqueues, it never executes. Exactly one replica may
    # run: a second Beat would double every tick, and the fact-check crawl
    # would poll the source twice as often as the source was told to expect.
    # --schedule writes the last-run-at file into /tmp so a restart doesn't
    # replay a tick it already fired.
    command: celery -A app.worker beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # The beat schedule is built from these at startup (see
      # app/worker/celery_app.py::_beat_schedule) — changing the interval
      # means restarting this container, not editing code.
      - FACT_INGESTION_ENABLED=${FACT_INGESTION_ENABLED:-true}
      - FACT_INGESTION_INTERVAL_MINUTES=${FACT_INGESTION_INTERVAL_MINUTES:-60}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    networks:
      - jawara-net

  ml-service:
    build: ./ml-service
    container_name: jawara-ml
    restart: always
    ports:
      # 127.0.0.1: internal service-to-service traffic goes over jawara-net;
      # this is host-side debugging access only, never public.
      - "127.0.0.1:${ML_SERVICE_PORT}:9000"
    environment:
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Retrieval quality. `:-` defaults for the same reason the ingestion vars
      # carry them: an .env written before this feature must not inject empty
      # strings and crash-loop the service on settings validation.
      - CLAIM_EXTRACTION_PROVIDER=${CLAIM_EXTRACTION_PROVIDER:-auto}
      - CLAIM_EXTRACTION_MIN_INPUT_CHARS=${CLAIM_EXTRACTION_MIN_INPUT_CHARS:-180}
      - RAG_RERANK_ENABLED=${RAG_RERANK_ENABLED:-true}
      - RAG_RELIABILITY_WEIGHT=${RAG_RELIABILITY_WEIGHT:-0.4}
      - RAG_RECENCY_WEIGHT=${RAG_RECENCY_WEIGHT:-0.25}
      - RAG_RECENCY_HALF_LIFE_DAYS=${RAG_RECENCY_HALF_LIFE_DAYS:-180}
      - LOG_LEVEL=${LOG_LEVEL}
      - MODEL_ARTIFACT_DIR=/app/model_artifacts
    volumes:
      # Trained classifier artifacts — must survive a container rebuild, since
      # the model registry (Postgres, owned by the gateway) tracks a checksum
      # against a specific file that has to still be there.
      - ml_model_artifacts:/app/model_artifacts
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      # Readiness, not liveness: dependants must not receive traffic while the
      # models are still loading (02_Architecture/04_ML_Service.md §6).
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os, urllib.request
          request = urllib.request.Request(
              "http://localhost:9000/v1/ready",
              headers={"X-Internal-Api-Key": os.environ["ML_SERVICE_API_KEY"]},
          )
          urllib.request.urlopen(request)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: jawara-postgres
    restart: always
    ports:
      # 127.0.0.1: never publish a database port to the open internet. Kept
      # published (not dropped) for the hybrid-local-dev workflow in
      # README.md, where a backend run outside Docker connects here directly.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: jawara-qdrant
    restart: always
    ports:
      # 127.0.0.1: Qdrant has no auth of its own in this stack — never public.
      - "127.0.0.1:${QDRANT_PORT}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jawara-net
    healthcheck:
      # qdrant/qdrant ships no wget/curl — talk HTTP over bash's /dev/tcp instead.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"healthz check passed\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: jawara-redis
    restart: always
    ports:
      # 127.0.0.1: Redis in this stack has no password (no auth mechanism
      # exists in the codebase at all) — an internet-facing 6379 is an open
      # door to the Celery broker, rate limiter, and threat-intel cache.
      - "127.0.0.1:${REDIS_PORT}:6379"
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend-dashboard:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* values are inlined into the client bundle by `next build`,
      # so they have to arrive as build args. Passing them only as runtime
      # `environment` would leave the browser calling the compile-time default.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: jawara-dashboard
    restart: always
    ports:
      # 127.0.0.1: public traffic comes in through `reverse-proxy`.
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  jawara-net:
    driver: bridge

volumes:
  waha_sessions:
  postgres_data:
  qdrant_data:
  ml_model_artifacts:
