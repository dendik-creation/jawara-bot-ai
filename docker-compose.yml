name: "jawara-bot-ai"
services:
  waha:
    image: devlikeapro/waha:latest
    container_name: jawara-waha
    restart: always
    ports:
      - "${WAHA_PORT}:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_HOOK_URL=http://api-gateway:8000/api/v1/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - jawara-net
    healthcheck:
      # /ping is the only unauthenticated route; / and /health return 401 once
      # WAHA_DASHBOARD_* credentials are set.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build: ./backend
    container_name: jawara-gateway
    restart: always
    ports:
      - "${API_GATEWAY_PORT}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS}
      - USER_HASH_SALT=${USER_HASH_SALT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - ML_SERVICE_URL=http://ml-service:9000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - AUTH_SESSION_TTL_MINUTES=${AUTH_SESSION_TTL_MINUTES}
      - AUTH_BCRYPT_ROUNDS=${AUTH_BCRYPT_ROUNDS}
      - AUTH_LOGIN_MAX_ATTEMPTS=${AUTH_LOGIN_MAX_ATTEMPTS}
      - AUTH_LOGIN_WINDOW_SECONDS=${AUTH_LOGIN_WINDOW_SECONDS}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
      - LOG_MESSAGE_CONTENT=${LOG_MESSAGE_CONTENT}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery-worker:
    build: ./backend
    container_name: jawara-worker
    restart: always
    command: celery -A app.worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WAHA_API_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - USER_HASH_SALT=${USER_HASH_SALT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - ML_SERVICE_URL=http://ml-service:9000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - GROUP_REPLY_REQUIRES_TRIGGER=${GROUP_REPLY_REQUIRES_TRIGGER}
      - BOT_WHATSAPP_IDS=${BOT_WHATSAPP_IDS}
      - LOG_MESSAGE_CONTENT=${LOG_MESSAGE_CONTENT}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      # CMD-SHELL, not CMD: exec form runs no shell, so $HOSTNAME would stay a
      # literal string and the ping would never match the node name.
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  ml-service:
    build: ./ml-service
    container_name: jawara-ml
    restart: always
    ports:
      - "${ML_SERVICE_PORT}:9000"
    environment:
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      # Readiness, not liveness: dependants must not receive traffic while the
      # models are still loading (02_Architecture/04_ML_Service.md §6).
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import os, urllib.request
          request = urllib.request.Request(
              "http://localhost:9000/v1/ready",
              headers={"X-Internal-Api-Key": os.environ["ML_SERVICE_API_KEY"]},
          )
          urllib.request.urlopen(request)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: jawara-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: jawara-qdrant
    restart: always
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jawara-net
    healthcheck:
      # qdrant/qdrant ships no wget/curl — talk HTTP over bash's /dev/tcp instead.
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"healthz check passed\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: jawara-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend-dashboard:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* values are inlined into the client bundle by `next build`,
      # so they have to arrive as build args. Passing them only as runtime
      # `environment` would leave the browser calling the compile-time default.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: jawara-dashboard
    restart: always
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - jawara-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  jawara-net:
    driver: bridge

volumes:
  waha_sessions:
  postgres_data:
  qdrant_data:
